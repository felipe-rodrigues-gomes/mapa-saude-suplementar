server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # dados, css e js mudam juntos a cada atualização: sempre revalidar (o ETag evita baixar de novo o que não mudou)
    location /dados/ { add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.(css|js)$ { add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Cache-Control "no-cache"; try_files $uri =404; }
    # assistente: o serviço n8n_evo_mapa-ia (pasta ia/) interpreta a pergunta. Resolver do Docker + variável:
    # se o serviço estiver fora do ar, o nginx sobe mesmo assim e /api devolve 502 (o site usa a leitura local)
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ia http://n8n_evo_mapa-ia:3000;
        proxy_pass $ia;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        client_max_body_size 4k;
        add_header Cache-Control "no-store" always;
    }

    # a página também é revalidada: é ela que aponta para a versão nova de css, js e dados
    location / { add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
