server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # dados mudam a cada atualização: revalidar; css/js podem ficar uma hora
    location /dados/ { add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.(css|js)$ { add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
